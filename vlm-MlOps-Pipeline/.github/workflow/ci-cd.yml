
name: VLM MLOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- Job 1: Lint and test ----
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install test dependencies
        run: |
          pip install flake8 pytest
          pip install -r requirements.inference.txt
      
      - name: Lint with flake8
        run: |
          # Fail on syntax errors
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings only for style
          flake8 . --count --max-line-length=120 --statistics
      
      - name: Run tests
        run: pytest tests/ -v

  # ---- Job 2: Build and push Docker image ----
  build-and-push:
    runs-on: ubuntu-latest
    needs: lint-and-test        # Only runs if tests pass
    if: github.ref == 'refs/heads/main'   # Only on main branch
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build inference image
        run: |
          docker build \
            -f inference/Dockerfile.inference \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/vlm-inference:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/vlm-inference:latest \
            .
      
      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/vlm-inference:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/vlm-inference:latest
      
      - name: Print image digest
        run: echo "Image pushed successfully with tag ${{ github.sha }}"
